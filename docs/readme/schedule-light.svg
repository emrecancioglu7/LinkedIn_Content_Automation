<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="170" viewBox="0 0 1200 170" role="img" aria-label="Schedule: Tech radar (daily 07:30) → Draft (Mon 08:30) → Visual (every 2 min) → Review (on Telegram) → Schedule (Mon 09:00) → Publish (every 15 min)"><title>Schedule: Tech radar (daily 07:30) → Draft (Mon 08:30) → Visual (every 2 min) → Review (on Telegram) → Schedule (Mon 09:00) → Publish (every 15 min)</title><style>text { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif; } .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; } 
    .fade { opacity: 0; animation: fade .7s ease-out forwards; }
    @keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    .pulse { stroke-dasharray: 16 600; stroke-dashoffset: 616; animation: flow 2.4s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: 0; } }
 
    .progress { stroke-dasharray: 1000; stroke-dashoffset: 1000; animation: run 7.0s linear infinite; }
    @keyframes run { 80%, 92% { stroke-dashoffset: 0; opacity: 1; } 100% { stroke-dashoffset: 0; opacity: 0; } }
    @keyframes lit0 { 0%, 0.0% { fill-opacity: 1; } 0.0%, 92% { fill-opacity: 1; } 100% { fill-opacity: 0; } }
@keyframes lit1 { 0%, 15.9% { fill-opacity: 0; } 16.0%, 92% { fill-opacity: 1; } 100% { fill-opacity: 0; } }
@keyframes lit2 { 0%, 31.9% { fill-opacity: 0; } 32.0%, 92% { fill-opacity: 1; } 100% { fill-opacity: 0; } }
@keyframes lit3 { 0%, 47.9% { fill-opacity: 0; } 48.0%, 92% { fill-opacity: 1; } 100% { fill-opacity: 0; } }
@keyframes lit4 { 0%, 63.9% { fill-opacity: 0; } 64.0%, 92% { fill-opacity: 1; } 100% { fill-opacity: 0; } }
@keyframes lit5 { 0%, 79.9% { fill-opacity: 0; } 80.0%, 92% { fill-opacity: 1; } 100% { fill-opacity: 0; } }
 @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .fade { opacity: 1; } .write { stroke-dashoffset: 0 !important; } .stamp { opacity: 1; } }</style>
    <defs>
      <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#ecfdf5"/></linearGradient>
      <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#059669" stop-opacity="0.18"/><stop offset="1" stop-color="#059669" stop-opacity="0"/></radialGradient>
      <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#e3ece8" stroke-width="1"/></pattern>
    </defs>
    <rect width="1200" height="170" rx="18" fill="url(#bg)"/>
    <rect width="1200" height="170" rx="18" fill="url(#grid)" opacity="0.5"/>
    <rect width="1200" height="170" rx="18" fill="url(#glow)"/>
    <rect x="0.5" y="0.5" width="1199" height="169" rx="18" fill="none" stroke="#d7e3dd"/><line x1="100" y1="70" x2="1100" y2="70" stroke="#e3ece8" stroke-width="4" stroke-linecap="round"/><line x1="100" y1="70" x2="1100" y2="70" stroke="#059669" stroke-width="4" stroke-linecap="round" class="progress"/><circle cx="100.0" cy="70" r="14" fill="#ffffff" stroke="#059669" stroke-width="3"/><circle cx="100.0" cy="70" r="8" fill="#059669" style="animation: lit0 7.0s linear infinite"/><text x="100.0" y="114" font-size="15" font-weight="700" fill="#17181a" text-anchor="middle" >Tech radar</text><text x="100.0" y="134" font-size="12" font-weight="400" fill="#5b6168" text-anchor="middle" class="mono">daily 07:30</text><circle cx="300.0" cy="70" r="14" fill="#ffffff" stroke="#059669" stroke-width="3"/><circle cx="300.0" cy="70" r="8" fill="#059669" style="animation: lit1 7.0s linear infinite"/><text x="300.0" y="114" font-size="15" font-weight="700" fill="#17181a" text-anchor="middle" >Draft</text><text x="300.0" y="134" font-size="12" font-weight="400" fill="#5b6168" text-anchor="middle" class="mono">Mon 08:30</text><circle cx="500.0" cy="70" r="14" fill="#ffffff" stroke="#059669" stroke-width="3"/><circle cx="500.0" cy="70" r="8" fill="#059669" style="animation: lit2 7.0s linear infinite"/><text x="500.0" y="114" font-size="15" font-weight="700" fill="#17181a" text-anchor="middle" >Visual</text><text x="500.0" y="134" font-size="12" font-weight="400" fill="#5b6168" text-anchor="middle" class="mono">every 2 min</text><circle cx="700.0" cy="70" r="14" fill="#ffffff" stroke="#059669" stroke-width="3"/><circle cx="700.0" cy="70" r="8" fill="#059669" style="animation: lit3 7.0s linear infinite"/><text x="700.0" y="114" font-size="15" font-weight="700" fill="#17181a" text-anchor="middle" >Review</text><text x="700.0" y="134" font-size="12" font-weight="400" fill="#5b6168" text-anchor="middle" class="mono">on Telegram</text><circle cx="900.0" cy="70" r="14" fill="#ffffff" stroke="#059669" stroke-width="3"/><circle cx="900.0" cy="70" r="8" fill="#059669" style="animation: lit4 7.0s linear infinite"/><text x="900.0" y="114" font-size="15" font-weight="700" fill="#17181a" text-anchor="middle" >Schedule</text><text x="900.0" y="134" font-size="12" font-weight="400" fill="#5b6168" text-anchor="middle" class="mono">Mon 09:00</text><circle cx="1100.0" cy="70" r="14" fill="#ffffff" stroke="#059669" stroke-width="3"/><circle cx="1100.0" cy="70" r="8" fill="#059669" style="animation: lit5 7.0s linear infinite"/><text x="1100.0" y="114" font-size="15" font-weight="700" fill="#17181a" text-anchor="middle" >Publish</text><text x="1100.0" y="134" font-size="12" font-weight="400" fill="#5b6168" text-anchor="middle" class="mono">every 15 min</text></svg>